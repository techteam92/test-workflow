name: Daily Git Mirror Backup

on:
  schedule:
    # Run at both 16:00 and 17:00 UTC, then gate to 12:00 America/New_York.
    # This avoids DST drift between EST and EDT.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  # Run from Actions tab for an immediate mirror (bypasses New York time gate).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gate run to Noon America/New_York (scheduled only)
        id: ny_time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: mirroring immediately (time gate skipped)."
          else
            NY_HOUR="$(TZ=America/New_York date +%H)"
            if [ "$NY_HOUR" = "12" ]; then
              echo "run_backup=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_backup=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: current New York hour is $NY_HOUR, not 12."
            fi
          fi

      - name: Validate required secrets
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
        shell: bash
        run: |
          trim_url() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SRC="$(trim_url "$SOURCE_REPO_URL")"
          DST="$(trim_url "$BACKUP_REMOTE_URL")"
          if [ -z "$SRC" ]; then
            echo "Missing required secret: SOURCE_REPO_URL"
            exit 1
          fi
          if [ -z "$DST" ]; then
            echo "Missing required secret: BACKUP_REMOTE_URL"
            exit 1
          fi

      - name: Mirror source repo into backup repo
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64
          import os
          import subprocess
          import tempfile
          from urllib.parse import unquote, urlparse, urlunparse

          def trim(s: str) -> str:
              return "".join(s.split())

          def split_github_url(label: str, raw: str):
              raw = trim(raw)
              p = urlparse(raw)
              if p.scheme not in ("http", "https") or not p.hostname:
                  raise SystemExit(f"{label}: invalid URL")
              if p.hostname.lower() != "github.com":
                  raise SystemExit(f"{label}: only https://github.com/... is supported")
              user = unquote(p.username or "")
              password = unquote(p.password or "")
              if not user or password == "":
                  raise SystemExit(
                      f"{label}: use https://USERNAME:TOKEN@github.com/owner/repo.git"
                  )
              host = p.hostname
              if p.port:
                  host = f"{p.hostname}:{p.port}"
              clean = urlunparse((p.scheme, host, p.path, "", "", ""))
              basic = base64.b64encode(f"{user}:{password}".encode()).decode()
              header = f"AUTHORIZATION: basic {basic}"
              return clean, header

          def git_env():
              e = {k: v for k, v in os.environ.items() if k not in ("GITHUB_TOKEN", "GH_TOKEN")}
              e["GIT_TERMINAL_PROMPT"] = "0"
              return e

          def run_git(args):
              subprocess.run(args, check=True, env=git_env())

          src_clean, src_hdr = split_github_url("SOURCE_REPO_URL", os.environ["SOURCE_REPO_URL"])
          dst_clean, dst_hdr = split_github_url("BACKUP_REMOTE_URL", os.environ["BACKUP_REMOTE_URL"])

          print("Clone (credential-less URL):", src_clean)
          print("Push (credential-less URL):", dst_clean)

          wd = tempfile.mkdtemp()
          os.chdir(wd)

          run_git(
              [
                  "git",
                  "-c",
                  "credential.helper=",
                  "-c",
                  f"http.extraHeader={src_hdr}",
                  "clone",
                  "--mirror",
                  src_clean,
                  "source-mirror.git",
              ]
          )
          os.chdir(os.path.join(wd, "source-mirror.git"))
          run_git(["git", "remote", "set-url", "origin", dst_clean])
          run_git(
              [
                  "git",
                  "-c",
                  "credential.helper=",
                  "-c",
                  f"http.extraHeader={dst_hdr}",
                  "push",
                  "--mirror",
                  "origin",
              ]
          )
          PY
