# Sync source branch → destination branch (default: auto-pick main or master → mirror), then prune extras.
# Repo variables (optional): SOURCE_BRANCH_FOR_DEST_MAIN, DEST_MAIN_BRANCH, SYNC_BRANCH_NAMES,
# AUTO_SOURCE_BRANCH_PRIORITY (comma list, default main,master), PRUNE_DEST_BRANCHES (true|false),
# PRUNE_KEEP_BRANCHES (comma-separated; default keeps main + mirror).
#
# GitHub cannot delete the repository default branch via git push --delete; switch default branch first if needed.

name: Sync source repo to destination every 12 hours

on:
  schedule:
    # Every 12 hours at minute 0 UTC (00:00 and 12:00 UTC).
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.SOURCE_REPO_URL }}" ]; then
            echo "Missing required secret: SOURCE_REPO_URL"
            exit 1
          fi
          if [ -z "${{ secrets.BACKUP_REMOTE_URL }}" ]; then
            echo "Missing required secret: BACKUP_REMOTE_URL"
            exit 1
          fi

      # Runner injects GITHUB_TOKEN for this repo only; push uses PAT in BACKUP_REMOTE_URL.
      # Bash unset is not always enough; use PAT-only subprocess env + encoded HTTPS URLs.
      - name: Mirror source repo into destination repo
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
          SYNC_BRANCH_NAMES: ${{ vars.SYNC_BRANCH_NAMES }}
          SOURCE_BRANCH_FOR_DEST_MAIN: ${{ vars.SOURCE_BRANCH_FOR_DEST_MAIN }}
          DEST_MAIN_BRANCH: ${{ vars.DEST_MAIN_BRANCH }}
          PRUNE_DEST_BRANCHES: ${{ vars.PRUNE_DEST_BRANCHES }}
          PRUNE_KEEP_BRANCHES: ${{ vars.PRUNE_KEEP_BRANCHES }}
          AUTO_SOURCE_BRANCH_PRIORITY: ${{ vars.AUTO_SOURCE_BRANCH_PRIORITY }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          python3 << 'PY'
          import os
          import subprocess
          import tempfile
          from urllib.parse import quote, unquote, urlparse, urlunparse

          def trim(s):
              return "".join(s.split())

          dest_main_branch = trim(os.environ.get("DEST_MAIN_BRANCH", "") or "") or "mirror"
          sync_raw = trim(os.environ.get("SYNC_BRANCH_NAMES", "") or "")
          source_as_main = trim(os.environ.get("SOURCE_BRANCH_FOR_DEST_MAIN", "") or "")
          branch_allow = None
          auto_pick_source_branch = False
          if sync_raw:
              branch_allow = set(x.strip() for x in sync_raw.split(",") if trim(x))
              source_as_main = ""
              print(
                  "Branch filter (SYNC_BRANCH_NAMES): %s"
                  % ", ".join(sorted(branch_allow)),
                  flush=True,
              )
          elif source_as_main:
              print(
                  "Single-branch → destination %s: source branch %r → refs/heads/%s"
                  % (dest_main_branch, source_as_main, dest_main_branch),
                  flush=True,
              )
          else:
              auto_pick_source_branch = True
              priority_hint = (
                  trim(os.environ.get("AUTO_SOURCE_BRANCH_PRIORITY", "") or "") or "main,master"
              )
              print(
                  "Single-branch sync: will auto-pick source branch (priority %s) → destination %r"
                  % (priority_hint, dest_main_branch),
                  flush=True,
              )

          prune_flag = trim(os.environ.get("PRUNE_DEST_BRANCHES", "") or "").lower()
          prune_enabled = prune_flag not in ("0", "false", "no", "off")
          keep_raw = trim(os.environ.get("PRUNE_KEEP_BRANCHES", "") or "") or "main,mirror"
          prune_keep = set(trim(x) for x in keep_raw.split(",") if trim(x))
          prune_keep.add(dest_main_branch)

          def split_url(label, raw):
              raw = trim(raw)
              p = urlparse(raw)
              if p.scheme not in ("http", "https") or not p.hostname:
                  raise SystemExit("%s: invalid URL" % label)
              if p.hostname.lower() != "github.com":
                  raise SystemExit("%s: only https://github.com/..." % label)
              user = unquote(p.username or "")
              password = unquote(p.password or "")
              if not user or not password:
                  raise SystemExit("%s: use https://USER:TOKEN@github.com/owner/repo.git" % label)
              host = p.hostname
              if p.port:
                  host = "%s:%s" % (p.hostname, p.port)
              redacted = urlunparse((p.scheme, host, p.path, "", "", ""))
              uq = quote(user, safe="")
              pq = quote(password, safe="")
              authed = urlunparse((p.scheme, "%s:%s@%s" % (uq, pq, host), p.path, "", "", ""))
              return redacted, authed

          _empty_cfg = None
          # Runner $HOME often has .netrc / git helpers → libcurl sends wrong creds for github.com.
          _clean_home = tempfile.mkdtemp(prefix="git-clean-home-")

          def empty_global_cfg():
              global _empty_cfg
              if _empty_cfg is None:
                  fd, path = tempfile.mkstemp(prefix="git-empty-config-")
                  os.close(fd)
                  _empty_cfg = path
              return _empty_cfg

          def git_env():
              drop = (
                  "GITHUB_TOKEN",
                  "GH_TOKEN",
                  "ACTIONS_ID_TOKEN",
              )
              e = {}
              for k, v in os.environ.items():
                  if k in drop:
                      continue
                  e[k] = v
              e["GIT_TERMINAL_PROMPT"] = "0"
              e["GIT_CONFIG_GLOBAL"] = empty_global_cfg()
              e["GIT_CONFIG_NOSYSTEM"] = "true"
              e["HOME"] = _clean_home
              cfg = os.path.join(_clean_home, ".config")
              cache = os.path.join(_clean_home, ".cache")
              os.makedirs(cfg, exist_ok=True)
              os.makedirs(cache, exist_ok=True)
              e["XDG_CONFIG_HOME"] = cfg
              e["XDG_CACHE_HOME"] = cache
              return e

          def run_git(argv):
              r = subprocess.run(argv, env=git_env())
              if r.returncode != 0:
                  raise SystemExit("git failed with exit code %d (see log above)." % r.returncode)

          def run_git_warn(argv):
              r = subprocess.run(argv, env=git_env())
              if r.returncode != 0:
                  print("warning: git returned %d for: %s" % (r.returncode, argv), flush=True)

          def list_refs(prefix):
              r = subprocess.run(
                  ["git", "for-each-ref", "--format=%(refname)", prefix],
                  env=git_env(),
                  capture_output=True,
                  text=True,
              )
              if r.returncode != 0:
                  raise SystemExit("git for-each-ref failed listing %s." % prefix)
              out = []
              for ln in r.stdout.splitlines():
                  ln = ln.strip()
                  if ln:
                      out.append(ln)
              return out

          def strip_pull_refs():
              refs = list_refs("refs/pull")
              for ref in refs:
                  run_git(["git", "update-ref", "-d", ref])
              if refs:
                  print("Dropped %d refs/pull ref(s) before push." % len(refs), flush=True)

          def short_branch_name(ref):
              p = "refs/heads/"
              if ref.startswith(p):
                  return ref[len(p) :]
              return ref

          def resolve_auto_source_branch():
              heads_list = list_refs("refs/heads")
              heads_short = set(short_branch_name(h) for h in heads_list)
              priority_raw = (
                  trim(os.environ.get("AUTO_SOURCE_BRANCH_PRIORITY", "") or "") or "main,master"
              )
              candidates = [trim(x) for x in priority_raw.split(",") if trim(x)]
              for cand in candidates:
                  if cand in heads_short:
                      return cand
              raise SystemExit(
                  "No source branch matched AUTO_SOURCE_BRANCH_PRIORITY (%s). "
                  "Set SOURCE_BRANCH_FOR_DEST_MAIN (e.g. master or home-screen). "
                  "Branches on source: %s"
                  % (
                      ", ".join(candidates),
                      ", ".join(sorted(heads_short)) or "(none)",
                  )
              )

          def prune_destination_branches():
              if not prune_enabled:
                  print("Skipping remote branch prune (PRUNE_DEST_BRANCHES disabled).", flush=True)
                  return
              if branch_allow is not None:
                  print("Skipping remote branch prune (SYNC_BRANCH_NAMES multi-branch mode).", flush=True)
                  return
              r = subprocess.run(
                  ["git", "ls-remote", "--heads", "origin"],
                  env=git_env(),
                  capture_output=True,
                  text=True,
              )
              if r.returncode != 0:
                  raise SystemExit("git ls-remote failed listing destination heads.")
              heads_prefix = "refs/heads/"
              to_delete = []
              for line in r.stdout.splitlines():
                  line = line.strip()
                  if not line or "\t" not in line:
                      continue
                  _sha, ref = line.split("\t", 1)
                  ref = ref.strip()
                  if not ref.startswith(heads_prefix):
                      continue
                  short = ref[len(heads_prefix) :]
                  if short not in prune_keep:
                      to_delete.append(short)
              if not to_delete:
                  print("No extra destination branches to prune.", flush=True)
                  return
              print(
                  "Pruning destination branches (not in keep set %s): %s"
                  % (
                      ", ".join(sorted(prune_keep)),
                      ", ".join(sorted(to_delete)),
                  ),
                  flush=True,
              )
              for name in sorted(to_delete):
                  run_git_warn(
                      [
                          "git",
                          "-c",
                          "credential.helper=",
                          "push",
                          "origin",
                          "--delete",
                          name,
                      ]
                  )

          def force_push_specs():
              specs = []
              if source_as_main:
                  src_ref = "refs/heads/%s" % source_as_main
                  heads = list_refs("refs/heads")
                  if src_ref not in heads:
                      raise SystemExit(
                          "Source branch %r not found on source (have: %s). "
                          "Fix SOURCE_BRANCH_FOR_DEST_MAIN or AUTO_SOURCE_BRANCH_PRIORITY."
                          % (
                              source_as_main,
                              ", ".join(sorted(short_branch_name(h) for h in heads))
                              or "(none)",
                          )
                      )
                  dst_ref = "refs/heads/%s" % dest_main_branch
                  specs.append("+%s:%s" % (src_ref, dst_ref))
              else:
                  for ref in list_refs("refs/heads"):
                      if branch_allow is not None and short_branch_name(ref) not in branch_allow:
                          continue
                      specs.append("+%s:%s" % (ref, ref))
              for ref in list_refs("refs/tags"):
                  specs.append("+%s:%s" % (ref, ref))
              return specs

          src_show, src_git = split_url("SOURCE_REPO_URL", os.environ["SOURCE_REPO_URL"])
          dst_show, dst_git = split_url("BACKUP_REMOTE_URL", os.environ["BACKUP_REMOTE_URL"])
          print("Source clone URL (redacted):", src_show, flush=True)
          print("Destination push URL (redacted):", dst_show, flush=True)

          wd = tempfile.mkdtemp()
          os.chdir(wd)
          run_git(
              [
                  "git",
                  "-c",
                  "credential.helper=",
                  "clone",
                  "--mirror",
                  src_git,
                  "source-mirror.git",
              ]
          )
          os.chdir(os.path.join(wd, "source-mirror.git"))
          strip_pull_refs()
          run_git(["git", "remote", "set-url", "origin", dst_git])
          # clone --mirror sets remote.origin.mirror=true; explicit refspec pushes require mirror=false.
          run_git(["git", "config", "--bool", "remote.origin.mirror", "false"])
          if auto_pick_source_branch:
              source_as_main = resolve_auto_source_branch()
              print(
                  "Auto-selected source branch %r → refs/heads/%s"
                  % (source_as_main, dest_main_branch),
                  flush=True,
              )
          specs = force_push_specs()
          if not specs:
              raise SystemExit("No refs/heads or refs/tags on source after clone; nothing to push.")
          run_git(["git", "-c", "credential.helper=", "push", "origin"] + specs)
          prune_destination_branches()
          PY
