name: Daily Git Mirror Backup

on:
  schedule:
    # Run at both 16:00 and 17:00 UTC, then gate to 12:00 America/New_York.
    # This avoids DST drift between EST and EDT.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  # Run from Actions tab for an immediate mirror (bypasses New York time gate).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gate run to Noon America/New_York (scheduled only)
        id: ny_time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: mirroring immediately (time gate skipped)."
          else
            NY_HOUR="$(TZ=America/New_York date +%H)"
            if [ "$NY_HOUR" = "12" ]; then
              echo "run_backup=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_backup=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: current New York hour is $NY_HOUR, not 12."
            fi
          fi

      - name: Validate required secrets
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
        shell: bash
        run: |
          trim_url() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SRC="$(trim_url "$SOURCE_REPO_URL")"
          DST="$(trim_url "$BACKUP_REMOTE_URL")"
          if [ -z "$SRC" ]; then
            echo "Missing required secret: SOURCE_REPO_URL"
            exit 1
          fi
          if [ -z "$DST" ]; then
            echo "Missing required secret: BACKUP_REMOTE_URL"
            exit 1
          fi

      - name: Mirror source repo into backup repo
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          trim_url() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          SRC="$(trim_url "$SOURCE_REPO_URL")"
          DST="$(trim_url "$BACKUP_REMOTE_URL")"

          # Prove which repos Actions sees (no token in log).
          redact_git_url() { echo "$1" | sed -E 's#https?://[^@]+@#https://#'; }
          echo "Clone URL (redacted): $(redact_git_url "$SRC")"
          echo "Push URL (redacted):   $(redact_git_url "$DST")"

          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          # GitHub Actions can inject http.https://github.com/.extraheader (GITHUB_TOKEN for this
          # workflow repo). That overrides user:token in the URL and breaks clone/push to other repos.
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # Clone source as a mirror (all refs, tags, branches).
          git \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            clone --mirror "$SRC" source-mirror.git
          cd source-mirror.git

          # Force mirror all refs to the backup repository.
          git remote set-url origin "$DST"
          git \
            -c credential.helper= \
            -c http.https://github.com/.extraheader= \
            push --mirror origin
