name: Daily Git Mirror Backup

on:
  schedule:
    # Run at both 16:00 and 17:00 UTC, then gate to 12:00 America/New_York.
    # This avoids DST drift between EST and EDT.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  # Actions tab → Run workflow: mirror immediately (skips New York noon gate).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gate run to Noon America/New_York (scheduled only)
        id: ny_time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_backup=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: mirroring to backup immediately (time gate skipped)."
          else
            NY_HOUR="$(TZ=America/New_York date +%H)"
            if [ "$NY_HOUR" = "12" ]; then
              echo "run_backup=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_backup=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: current New York hour is $NY_HOUR, not 12."
            fi
          fi

      - name: Validate required secrets
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        shell: bash
        run: |
          if [ -z "${{ secrets.SOURCE_REPO_URL }}" ]; then
            echo "Missing required secret: SOURCE_REPO_URL"
            exit 1
          fi
          if [ -z "${{ secrets.BACKUP_REMOTE_URL }}" ]; then
            echo "Missing required secret: BACKUP_REMOTE_URL"
            exit 1
          fi

      # Job runs inside BACKUP repo: runner injects GITHUB_TOKEN scoped to this repo only.
      # Bash unset is not always enough; use PAT-only subprocess env + encoded HTTPS URLs.
      - name: Mirror source repo into backup repo
        if: steps.ny_time_gate.outputs.run_backup == 'true'
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          BACKUP_REMOTE_URL: ${{ secrets.BACKUP_REMOTE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          python3 << 'PY'
          import os
          import subprocess
          import tempfile
          from urllib.parse import quote, unquote, urlparse, urlunparse

          def trim(s):
              return "".join(s.split())

          def split_url(label, raw):
              raw = trim(raw)
              p = urlparse(raw)
              if p.scheme not in ("http", "https") or not p.hostname:
                  raise SystemExit("%s: invalid URL" % label)
              if p.hostname.lower() != "github.com":
                  raise SystemExit("%s: only https://github.com/..." % label)
              user = unquote(p.username or "")
              password = unquote(p.password or "")
              if not user or not password:
                  raise SystemExit("%s: use https://USER:TOKEN@github.com/owner/repo.git" % label)
              host = p.hostname
              if p.port:
                  host = "%s:%s" % (p.hostname, p.port)
              redacted = urlunparse((p.scheme, host, p.path, "", "", ""))
              uq = quote(user, safe="")
              pq = quote(password, safe="")
              authed = urlunparse((p.scheme, "%s:%s@%s" % (uq, pq, host), p.path, "", "", ""))
              return redacted, authed

          _empty_cfg = None
          # Runner $HOME often has .netrc / git helpers → libcurl sends wrong creds for github.com.
          _clean_home = tempfile.mkdtemp(prefix="git-clean-home-")

          def empty_global_cfg():
              global _empty_cfg
              if _empty_cfg is None:
                  fd, path = tempfile.mkstemp(prefix="git-empty-config-")
                  os.close(fd)
                  _empty_cfg = path
              return _empty_cfg

          def git_env():
              drop = (
                  "GITHUB_TOKEN",
                  "GH_TOKEN",
                  "ACTIONS_ID_TOKEN",
              )
              e = {}
              for k, v in os.environ.items():
                  if k in drop:
                      continue
                  e[k] = v
              e["GIT_TERMINAL_PROMPT"] = "0"
              e["GIT_CONFIG_GLOBAL"] = empty_global_cfg()
              e["GIT_CONFIG_NOSYSTEM"] = "true"
              e["HOME"] = _clean_home
              cfg = os.path.join(_clean_home, ".config")
              cache = os.path.join(_clean_home, ".cache")
              os.makedirs(cfg, exist_ok=True)
              os.makedirs(cache, exist_ok=True)
              e["XDG_CONFIG_HOME"] = cfg
              e["XDG_CACHE_HOME"] = cache
              return e

          def run_git(argv):
              r = subprocess.run(argv, env=git_env())
              if r.returncode != 0:
                  raise SystemExit("git failed with exit code %d (see log above)." % r.returncode)

          src_show, src_git = split_url("SOURCE_REPO_URL", os.environ["SOURCE_REPO_URL"])
          dst_show, dst_git = split_url("BACKUP_REMOTE_URL", os.environ["BACKUP_REMOTE_URL"])
          print("Clone URL (redacted):", src_show, flush=True)
          print("Push URL (redacted):", dst_show, flush=True)

          wd = tempfile.mkdtemp()
          os.chdir(wd)
          run_git(
              [
                  "git",
                  "-c",
                  "credential.helper=",
                  "clone",
                  "--mirror",
                  src_git,
                  "source-mirror.git",
              ]
          )
          os.chdir(os.path.join(wd, "source-mirror.git"))
          run_git(["git", "remote", "set-url", "origin", dst_git])
          run_git(
              [
                  "git",
                  "-c",
                  "credential.helper=",
                  "push",
                  "--mirror",
                  "origin",
              ]
          )
          PY
